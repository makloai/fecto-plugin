<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f4;
    --surface: #fcfcfb;
    --border: #e4e3df;
    --text: #0b0b0b;
    --text-2: #52514e;
    --muted: #7a7974;
    --accent: #2a78d6;
    --accent-soft: #cde2fb;
    --good: #006300;
    --bad: #b42d2d;
    --good-bg: #e6f4e6;
    --bad-bg: #fbe9e9;
    --grid: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110;
      --surface: #1a1a19;
      --border: #2e2e2c;
      --text: #f0efec;
      --text-2: #c3c2b7;
      --muted: #94938c;
      --accent: #3987e5;
      --accent-soft: #184f95;
      --good: #4cc84c;
      --bad: #ef7c7c;
      --good-bg: #16301a;
      --bad-bg: #3a1c1c;
      --grid: #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --border: #2e2e2c;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --muted: #94938c;
    --accent: #3987e5;
    --accent-soft: #184f95;
    --good: #4cc84c;
    --bad: #ef7c7c;
    --good-bg: #16301a;
    --bad-bg: #3a1c1c;
    --grid: #262624;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: flex-end; margin-bottom: 28px; }
  h1 { font-size: 24px; margin: 0 0 4px; font-weight: 650; }
  .sub { color: var(--text-2); }
  .meta { color: var(--muted); font-size: 13px; text-align: right; }
  .stale { color: var(--bad); }
  h2 { font-size: 15px; font-weight: 600; margin: 32px 0 4px; }
  .section-note { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; margin-top: 12px; }
  .grid.hero { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; position: relative; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .label { color: var(--text-2); font-weight: 550; }
  .value { font-size: 28px; font-weight: 650; margin: 6px 0 2px; letter-spacing: -0.01em; }
  .hero .value { font-size: 48px; }
  .delta { display: inline-flex; gap: 4px; align-items: center; font-size: 12.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; }
  .delta.good { color: var(--good); background: var(--good-bg); }
  .delta.bad { color: var(--bad); background: var(--bad-bg); }
  .delta.flat { color: var(--muted); background: var(--grid); }
  .vs { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
  .why { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .source { position: absolute; top: 14px; right: 14px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .error { color: var(--bad); font-size: 13px; margin-top: 8px; word-break: break-word; }
  .spark { position: relative; height: 44px; margin-top: 12px; }
  .spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .spark .line { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
  .spark .area { fill: var(--accent-soft); opacity: 0.45; }
  .spark .dot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); display: none; pointer-events: none; }
  .tip { position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); background: var(--text); color: var(--surface); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; display: none; pointer-events: none; z-index: 2; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 550; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--grid); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.text { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .empty { padding: 48px 16px; text-align: center; color: var(--text-2); }
  code { background: var(--grid); padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 560px) { .hero .value { font-size: 40px; } .meta { text-align: left; } }
</style>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const D = window.DASHBOARD;
  if (!D) {
    app.innerHTML = '<div class="empty">No data yet. Run <code>node fetch.mjs</code> in this folder, then reload.</div>';
    return;
  }

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const nf = (opts) => new Intl.NumberFormat(undefined, opts);

  function format(v, fmt, currency) {
    if (v == null || Number.isNaN(v)) return '—';
    switch (fmt) {
      case 'percent': return nf({ style: 'percent', maximumFractionDigits: v < 0.1 ? 2 : 1 }).format(v);
      case 'currency': return nf({ style: 'currency', currency: (currency || 'USD').toUpperCase(), notation: Math.abs(v) >= 100000 ? 'compact' : 'standard', maximumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2 }).format(v);
      case 'decimal': return nf({ maximumFractionDigits: 1, minimumFractionDigits: 1 }).format(v);
      case 'duration': {
        const s = Math.round(v), m = Math.floor(s / 60);
        return m ? `${m}m ${String(s % 60).padStart(2, '0')}s` : `${s}s`;
      }
      case 'text': return String(v);
      default: return nf({ notation: Math.abs(v) >= 100000 ? 'compact' : 'standard', maximumFractionDigits: Math.abs(v) < 10 && !Number.isInteger(v) ? 2 : 0 }).format(v);
    }
  }

  const fmtDate = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });

  // Rates and positions change in points; counts and money change in percent.
  function delta(item) {
    const { value: v, previousValue: p, format: fmt, goodWhen } = item;
    if (v == null || p == null) return '';
    let text, diff = v - p;
    if (fmt === 'percent') text = `${diff >= 0 ? '+' : '−'}${Math.abs(diff * 100).toFixed(1)} pts`;
    else if (fmt === 'decimal') text = `${diff >= 0 ? '+' : '−'}${Math.abs(diff).toFixed(1)}`;
    else if (p === 0) text = v === 0 ? '0%' : 'new';
    else text = `${diff >= 0 ? '+' : '−'}${Math.abs((diff / Math.abs(p)) * 100).toFixed(Math.abs(diff / p) < 0.1 ? 1 : 0)}%`;
    const small = p !== 0 && Math.abs(diff / p) < 0.005;
    if (diff === 0 || small) text = 'no change';
    const cls = diff === 0 || small ? 'flat' : (diff > 0) === (goodWhen !== 'down') ? 'good' : 'bad';
    const arrow = diff === 0 || small ? '→' : diff > 0 ? '▲' : '▼';
    return `<span class="delta ${cls}" title="Previous period: ${esc(format(p, fmt, item.currency))}">${arrow} ${text}</span><span class="vs">vs prev ${D.periodDays}d</span>`;
  }

  function sparkline(item) {
    const pts = (item.series || []).filter((p) => p.value != null);
    if (pts.length < 2) return '';
    const series = item.series;
    const vals = pts.map((p) => p.value);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (item.format !== 'decimal' && item.format !== 'percent') min = Math.min(0, min);
    if (max === min) max = min + 1;
    const W = 100, H = 40, n = series.length;
    const x = (i) => (i / (n - 1)) * W;
    // Lower-is-better numbers (search position) plot upside down, so up always means better.
    const flip = item.goodWhen === 'down';
    const y = (v) => (flip ? 0 : H) + (flip ? 1 : -1) * ((v - min) / (max - min)) * H;
    let d = '', started = false;
    series.forEach((p, i) => {
      if (p.value == null) { started = false; return; }
      d += `${started ? 'L' : 'M'}${x(i).toFixed(2)},${y(p.value).toFixed(2)}`;
      started = true;
    });
    const area = flip || item.format === 'decimal' || item.format === 'percent' || series.some((p) => p.value == null)
      ? '' : `<path class="area" d="${d}L${W},${H}L0,${H}Z"/>`;
    return `<div class="spark" data-id="${esc(item._key)}"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily ${esc(item.label)}">${area}<path class="line" d="${d}"/></svg><div class="dot"></div><div class="tip"></div></div>`;
  }

  function kpi(item, hero) {
    const range = item.range && item.range.to !== D.endDate ? ` · through ${fmtDate(item.range.to)}` : '';
    let body;
    if (item.error) body = `<div class="value">—</div><div class="error">${esc(item.error)}</div>`;
    else body = `<div class="value">${format(item.value, item.format, item.currency)}</div>
      <div>${item.snapshot ? '<span class="vs" style="margin:0">right now</span>' : delta(item)}<span class="vs">${range}</span></div>
      ${sparkline(item)}`;
    return `<div class="card">
      <span class="source">${esc(item.source === 'ratio' ? '' : item.source)}</span>
      <div class="label">${esc(item.label)}</div>${body}
      ${item.note ? `<div class="why">${esc(item.note)}</div>` : ''}
      ${item.why ? `<div class="why">${esc(item.why)}</div>` : ''}
    </div>`;
  }

  function table(item) {
    let body;
    if (item.error) body = `<div class="error">${esc(item.error)}</div>`;
    else if (!item.table?.rows?.length) body = '<div class="why">No rows for this period.</div>';
    else {
      const cols = item.columns || item.table.columns;
      body = `<div class="table-wrap"><table><thead><tr>${cols.map((c) => `<th class="${c.format === 'text' ? '' : 'num'}">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${
        item.table.rows.map((r) => `<tr>${cols.map((c) => c.format === 'text'
          ? `<td class="text" title="${esc(r[c.key])}">${esc(r[c.key])}</td>`
          : `<td class="num">${format(r[c.key], c.format, item.currency)}</td>`).join('')}</tr>`).join('')
      }</tbody></table></div>`;
    }
    return `<div class="card wide"><span class="source">${esc(item.source)}</span><div class="label">${esc(item.label)}</div>
      ${item.why ? `<div class="why" style="margin-top:4px">${esc(item.why)}</div>` : ''}${body}</div>`;
  }

  const items = D.sections.flatMap((s) => s.items);
  items.forEach((it, i) => (it._key = String(i)));
  const ends = items.map((i) => i.range?.to).filter(Boolean).sort();
  D.endDate = ends[ends.length - 1];
  const starts = items.filter((i) => i.range?.to === D.endDate).map((i) => i.range.from);
  const hero = items.filter((i) => i.northStar && i.type !== 'table');
  const generated = new Date(D.generatedAt);
  const ageDays = (Date.now() - generated) / 86400000;

  let html = `<header><div>
      <h1>${esc(D.site)}</h1>
      <div class="sub">${D.moneyAction ? `Makes money when ${esc(D.moneyAction)}` : esc(D.siteType || '')}</div>
    </div><div class="meta">
      ${starts.length ? `${fmtDate(starts[0])} – ${fmtDate(D.endDate)} · last ${D.periodDays} days<br>` : ''}
      <span class="${ageDays > 2 ? 'stale' : ''}">Updated ${generated.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })}</span>
      · refresh with <code>node fetch.mjs</code>
    </div></header>`;
  if (hero.length) html += `<div class="grid hero">${hero.map((i) => kpi(i, true)).join('')}</div>`;
  for (const s of D.sections) {
    const rest = s.items.filter((i) => !(i.northStar && i.type !== 'table'));
    if (!rest.length) continue;
    html += `<h2>${esc(s.title)}</h2>${s.note ? `<p class="section-note">${esc(s.note)}</p>` : ''}
      <div class="grid">${rest.map((i) => (i.type === 'table' ? table(i) : kpi(i))).join('')}</div>`;
  }
  app.innerHTML = html;
  document.title = `${D.site} · dashboard`;

  // Hover: nearest day's value under the pointer.
  const byKey = new Map(items.map((i) => [i._key, i]));
  document.querySelectorAll('.spark').forEach((el) => {
    const item = byKey.get(el.dataset.id);
    const series = item.series, dot = el.querySelector('.dot'), tip = el.querySelector('.tip');
    const vals = series.filter((p) => p.value != null).map((p) => p.value);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (item.format !== 'decimal' && item.format !== 'percent') min = Math.min(0, min);
    if (max === min) max = min + 1;
    const hide = () => { dot.style.display = tip.style.display = 'none'; };
    el.addEventListener('pointermove', (e) => {
      const r = el.getBoundingClientRect();
      const i = Math.round(((e.clientX - r.left) / r.width) * (series.length - 1));
      const p = series[Math.max(0, Math.min(series.length - 1, i))];
      if (!p || p.value == null) return hide();
      const left = (series.indexOf(p) / (series.length - 1)) * r.width;
      const frac = (p.value - min) / (max - min);
      const top = item.goodWhen === 'down' ? frac * r.height : r.height - frac * r.height;
      dot.style.cssText = `display:block;left:${left}px;top:${top}px`;
      tip.style.cssText = `display:block;left:${Math.max(40, Math.min(r.width - 40, left))}px`;
      tip.textContent = `${fmtDate(p.date)} · ${format(p.value, item.format, item.currency)}`;
    });
    el.addEventListener('pointerleave', hide);
  });
})();
</script>
</body>
</html>
